"build:erofs":
  image: docker:latest
  stage: build-erofs
  tags:
    - docker-root
  services:
    - docker:dind
  variables:
    CACHE_PATH: /cache
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  script:
    - cp ./config.sample $CI_PROJECT_DIR/config
    - |
      docker run --privileged --rm \
        -v "$CI_PROJECT_DIR/cache":"/var/cache/jugendhackt-iso" \
        -v "$CI_PROJECT_DIR/config":"/config" \
        -v "$CI_PROJECT_DIR/data":"/data" \
        $IMAGE_TAG \
        /jugendhackt-iso.sh build
  artifacts:
    paths:
      - $CI_PROJECT_DIR/cache/*.erofs
    expire_in: 1 hours

"build:iso":
  image: docker:latest
  stage: build-iso
  tags:
    - docker-root
  services:
    - docker:dind
  variables:
    CACHE_PATH: /cache
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  script:
    - cp ./config.sample $CI_PROJECT_DIR/config
    - |
      docker run --privileged --rm \
        -v "$CI_PROJECT_DIR/cache":"/var/cache/jugendhackt-iso" \
        -v "$CI_PROJECT_DIR/config":"/config" \
        --mount type=bind,source=/dev,target=/dev \
        $IMAGE_TAG \
        /jugendhackt-iso.sh image
  artifacts:
    paths:
      - $CI_PROJECT_DIR/cache/*.img
      - $CI_PROJECT_DIR/cache/*.sum
    expire_in: 7 days

"test:iso":
  image: docker:latest
  stage: test-iso
  tags:
    - docker-root
  services:
    - docker:dind
  dependencies:
    - "build:iso"
  variables:
    CACHE_PATH: /cache
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  script:
    - cp ./config.sample $CI_PROJECT_DIR/config
    - |
      docker run --privileged --rm \
        --device=/dev/kvm \
        -v "$CI_PROJECT_DIR/cache":"/var/cache/jugendhackt-iso" \
        -v "$CI_PROJECT_DIR/config":"/config" \
        $IMAGE_TAG \
        /jugendhackt-iso.sh test bios ci
    - |
      docker run --privileged --rm \
        --device=/dev/kvm \
        -v "$CI_PROJECT_DIR/cache":"/var/cache/jugendhackt-iso" \
        -v "$CI_PROJECT_DIR/config":"/config" \
        $IMAGE_TAG \
        /jugendhackt-iso.sh test uefi ci

"publish:pages":
  stage: publish
  dependencies: []
  image: debian:latest
  script:
    - |
      apt-get update && \
      apt-get install -y curl jq  && \
      rm -rf /var/cache/apt/*
    - cp ./config.sample $CI_PROJECT_DIR/config
    - |
      export BUILD_JOB_ID="$(curl --header "JOB-TOKEN: $CI_JOB_TOKEN" $CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs | jq '.[] | select(.name | contains("build:iso")) | .id')"
    - export CONFIG_CHECKSUM="$(sha256sum config | awk '{ print $1 }')"
    - export ISO_VERSION="$(cat .iso-version)"
    - eval "echo \"$(cat pages/index.html)\"" > pages/index.html
    - eval "echo \"$(cat pages/_redirects)\"" > pages/_redirects
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  pages:
    publish: pages
