if [ -s $prefix/grubenv ]; then
  load_env
fi

if [ "${saved_entry}" ] ; then
  set default="${saved_entry}"
  set timeout=10
fi

export menuentry_id_option="--id"

function savedefault {
  saved_entry="${chosen}"
  save_env saved_entry
}

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

function live_boot {
  savedefault
  set gfxpayload=keep

  linux   /.live/vmlinuz boot=live components persistence persistence-label=Jugend-hackt-USB live-media-path=/.live noeject quiet splash live-config.locales=$locale.UTF-8 live-config.timezone=$timezone live-config.keyboard-layouts=$keyboard
  initrd  /.live/initrd.img
}

submenu "Jugend hackt DE" {
  set keyboard="de"
  set timezone="Europe/Berlin"
  menuentry "Deutsch" --id "jugendhackt-de-de" {
    set locale="de_DE"
    live_boot
  }
  menuentry "English" --id "jugendhackt-de-en" {
    set locale="en_US"
    live_boot
  }
}
submenu "Jugend hackt CH" {
  set keyboard="ch"
  set timezone="Europe/Zurich"
  menuentry "Deutsch" --id "jugendhackt-ch-de" {
    set locale="de_CH"
    live_boot
  }
  menuentry "English" --id "jugendhackt-ch-en" {
    set locale="en_US"
    live_boot
  }
  menuentry "français" --id "jugendhackt-ch-fr" {
    set locale="fr_CH"
    live_boot
  }
  menuentry "Italiano" --id "jugendhackt-ch-it" {
    set locale="it_CH"
    live_boot
  }
}
submenu "Jugend hackt AT" {
  set keyboard="de"
  set timezone="Europe/Vienna"
  menuentry "Deutsch" --id "jugendhackt-at-de" {
    set locale="de_AT"
    live_boot
  }
  menuentry "English" --id "jugendhackt-at-en" {
    set locale="en_US"
    live_boot
  }
}

grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
  exit 1
}
menuentry 'UEFI Firmware Settings' {
  fwsetup
}
fi

