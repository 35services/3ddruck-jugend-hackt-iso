---
# Copies the files from data/desktop to the user's desktop, like the image does,
# and writes snapmaker-konto.txt and makerworld-konto.txt with the logins for the
# AG's Snapmaker and MakerWorld accounts. The logins are read from ../secrets (ignored by git, see secrets.sample),
# the same file jugendhackt-iso.sh uses.
#
# On Linux, the files can't be changed by accident: like in the image, they belong to root
# and are kept in /usr/share/jugendhackt-iso/desktop, and the desktop has a link "Infos" to
# that folder. A read-only file on the desktop isn't enough, since a text editor can replace
# it with a new file, which the desktop folder allows. Copies on the desktop from older
# versions of this playbook are removed. (On a stick, the folder goes back to the image's
# files on reboot.) On a Mac, the files are copied to the desktop, read-only.
#
# Works on the Ubuntu laptops ([build]), on sticks and installed machines, and on Macs
# ([macs]). On Linux it needs sudo. A Mac needs Remote Login (System Settings > General >
# Sharing) and python3 (xcode-select --install).
#
# Usage: ansible-playbook -i inventory.ini desktop-files.yml

- name: Put the AG files on the desktop
  hosts: all
  become: false
  vars:
    snapmaker_username: >-
      {{ lookup('ansible.builtin.ini', 'SNAPMAKER_USERNAME', file=playbook_dir ~ '/../secrets',
                type='properties', default='') | regex_replace('^["\']?(.*?)["\']?$', '\1') }}
    snapmaker_password: >-
      {{ lookup('ansible.builtin.ini', 'SNAPMAKER_PASSWORD', file=playbook_dir ~ '/../secrets',
                type='properties', default='') | regex_replace('^["\']?(.*?)["\']?$', '\1') }}
    makerworld_username: >-
      {{ lookup('ansible.builtin.ini', 'MAKERWORLD_USERNAME', file=playbook_dir ~ '/../secrets',
                type='properties', default='') | regex_replace('^["\']?(.*?)["\']?$', '\1') }}
    makerworld_password: >-
      {{ lookup('ansible.builtin.ini', 'MAKERWORLD_PASSWORD', file=playbook_dir ~ '/../secrets',
                type='properties', default='') | regex_replace('^["\']?(.*?)["\']?$', '\1') }}
    shared_dir: /usr/share/jugendhackt-iso/desktop
    desktop_files: >-
      {{ query('ansible.builtin.fileglob', playbook_dir ~ '/../data/desktop/*') | map('basename') | list
         + ['snapmaker-konto.txt', 'makerworld-konto.txt', 'version.txt'] }}
    logins:
      - file: snapmaker-konto.txt
        content: |
          Snapmaker-Konto der 3D-Druck-AG
          ===============================

          Benutzer: {{ snapmaker_username }}
          Passwort: {{ snapmaker_password }}
      - file: makerworld-konto.txt
        content: |
          MakerWorld-Konto der 3D-Druck-AG
          ================================

          Benutzer: {{ makerworld_username }}
          Passwort: {{ makerworld_password }}

  tasks:
    - name: Make sure the Snapmaker login is set
      ansible.builtin.assert:
        that:
          - snapmaker_username | length > 0
          - snapmaker_password | length > 0
        fail_msg: Please copy secrets.sample to secrets and set SNAPMAKER_USERNAME and SNAPMAKER_PASSWORD
      no_log: true

    - name: Make sure the MakerWorld login is set
      ansible.builtin.assert:
        that:
          - makerworld_username | length > 0
          - makerworld_password | length > 0
        fail_msg: Please copy secrets.sample to secrets and set MAKERWORLD_USERNAME and MAKERWORLD_PASSWORD
      no_log: true

    # on Linux the folder name depends on the language, e.g. "Desktop" or "Schreibtisch"
    - name: Find the desktop folder
      ansible.builtin.command: xdg-user-dir DESKTOP
      register: xdg_desktop
      changed_when: false
      check_mode: false
      when: ansible_facts.system != 'Darwin'

    # macOS has no xdg-user-dir, its folder is always ~/Desktop ("Schreibtisch" is only the display name)
    - name: Remember the desktop folder
      ansible.builtin.set_fact:
        desktop_dir: >-
          {{ ansible_facts.user_dir ~ '/Desktop' if ansible_facts.system == 'Darwin' else xdg_desktop.stdout }}

    - name: Make sure the desktop folder exists
      ansible.builtin.file:
        path: "{{ desktop_dir }}"
        state: directory
        # macOS keeps ~/Desktop private (0700), don't open it up
        mode: "{{ omit if ansible_facts.system == 'Darwin' else '0755' }}"

    - name: Put the files on the desktop (Linux)
      when: ansible_facts.system != 'Darwin'
      block:
        - name: Make sure the folder for the files exists
          ansible.builtin.file:
            path: "{{ shared_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          become: true

        - name: Copy the files from data/desktop
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../data/desktop/"
            dest: "{{ shared_dir }}/"
            owner: root
            group: root
            mode: "0444"
          become: true

        # readable by every user of the machine, like in the image
        - name: Write the logins
          ansible.builtin.copy:
            dest: "{{ shared_dir }}/{{ item.file }}"
            content: "{{ item.content }}"
            owner: root
            group: root
            mode: "0444"
          loop: "{{ logins }}"
          become: true
          no_log: true

        - name: Remove the copies older versions put on the desktop
          ansible.builtin.file:
            path: "{{ desktop_dir }}/{{ item }}"
            state: absent
          loop: "{{ desktop_files }}"

        - name: Link the folder on the desktop
          ansible.builtin.file:
            src: "{{ shared_dir }}"
            dest: "{{ desktop_dir }}/Infos"
            state: link

    - name: Put the files on the desktop (macOS)
      when: ansible_facts.system == 'Darwin'
      block:
        - name: Copy the files from data/desktop
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../data/desktop/"
            dest: "{{ desktop_dir }}/"
            mode: "0444"

        - name: Write the logins
          ansible.builtin.copy:
            dest: "{{ desktop_dir }}/{{ item.file }}"
            content: "{{ item.content }}"
            mode: "0400"
          loop: "{{ logins }}"
          no_log: true
