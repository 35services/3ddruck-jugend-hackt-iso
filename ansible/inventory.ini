[build]
# Ubuntu 25.10 and newer use sudo-rs, which wraps Ansible's password prompt in its own
# ("[sudo: ...] Password:"), so Ansible never sees it and times out. sudo.ws is the classic sudo.
druck-lenovo.local ansible_user=druck ansible_become_exe=sudo.ws

[sticks]
# computers running a 3D-Druck-AG stick. They all have the same hostname, so they're
# listed by IP address, which can change
192.168.178.143
192.168.178.145

[installed]
# computers with a stick's system copied to their internal disk (README.md, "Install a
# stick's system onto a disk"). The password is still the Debian Live default.
# The 12" MacBook (Debian next to macOS): by its mDNS name, since macOS uses the same
# IP address with other SSH host keys
3d-ag-macbook-one.local

[installed:vars]
ansible_user=druck
ansible_become_password=live

[mx]
# MX Linux (experiment, branch mx-linux-iso): the 12" MacBook booted into the MX live
# system (mx-linux-iso.yml). Its hostname is the MX default "mx1", so it gets an alias.
# The live user and password are MX's defaults. A live system without persistence gets a
# new SSH host key on every boot, so its host key isn't checked
macbook-one-mx-linux ansible_host=mx1.local ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[mx:vars]
ansible_user=demo
ansible_become_password=demo

[macs]
# Macs only get the desktop files (desktop-files.yml), the other playbooks are for Ubuntu.
# A Mac needs Remote Login enabled. Ansible needs Python 3.9 or newer, macOS 11 only
# has 3.8, so this MacBook uses a standalone Python in ~/.local (python-build-standalone,
# no admin rights needed)
# 192.168.178.46 also has Debian installed, see [installed]
# 192.168.178.46 ansible_user=druck ansible_python_interpreter=/Users/druck/.local/python-3.12/bin/python3

[sticks:vars]
ansible_user=druck
# the Debian Live default password from data/live.conf, the same on every stick
ansible_become_password=live
